[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grading-agent"
version = "0.1.0"
description = "Rubric-grounded grading and feedback agent, evaluated for consistency and calibrated deferral"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "instructor>=1.3",
    "openai>=1.30",          # OpenAI-compatible: Gemini, Groq, OpenRouter, Ollama
    "pyyaml>=6.0",
    "docker>=7.1",
    "ruff>=0.5",             # also a runtime dependency: S2 feature extraction
    "radon>=6.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "fast-krippendorff>=0.6",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
ui = ["streamlit>=1.36"]

[project.scripts]
grading-eval = "eval.harness:main"
grading-generate = "data.mutations.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "eval", "data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]
