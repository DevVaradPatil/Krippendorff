[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Deliberately not plain "krippendorff": that name belongs to the alpha-computing
# library we depend on (installed as fast-krippendorff, imported as
# `krippendorff`). Keeping the distribution name distinct avoids a confusing
# collision in a project whose headline metric comes from that module.
name = "krippendorff-agent"
version = "0.1.0"
description = "Krippendorff - rubric-grounded grading agent, evaluated for consistency and calibrated deferral"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "instructor>=1.3",
    "openai>=1.30",          # OpenAI-compatible: Gemini, Groq, OpenRouter, Ollama
    "pyyaml>=6.0",
    "docker>=7.1",
    "ruff>=0.5",             # also a runtime dependency: S2 feature extraction
    "radon>=6.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    # Distribution is `krippendorff`; `fast-krippendorff` is not on PyPI.
    "krippendorff>=0.8",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
ui = ["streamlit>=1.36"]

[project.scripts]
krippendorff-eval = "eval.harness:main"
krippendorff-generate = "data.mutations.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["agent", "eval", "data"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Benchmark content is data, not project code: reference solutions are written
# in deliberately plain intro-Python, and S2 lints them itself as a scored
# feature. Holding them to the project's own rules would be measuring the
# wrong thing.
extend-exclude = ["data/problems", "data/synthetic", "agent/_runner.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]
