id: exp_series
title: Exponential by Taylor series
tags: [series-summation, convergence, accumulators]

statement: |
  `exp_series(x, tol=1e-12, max_terms=100)` approximates e**x by summing the
  Taylor series 1 + x + x**2/2! + x**3/3! + ...

  Build each term from the previous one rather than recomputing factorials, and
  stop once a term's magnitude falls below `tol`.

misconceptions_applicable: [CONV, ACC, OBO, DIV, CMP, OK, ALT]
